repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        pass_filenames: false
        files: ^backend/src/
      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && pnpm lint'
        language: system
        pass_filenames: false
        files: ^frontend/src/
