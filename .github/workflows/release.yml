# Adjunta el paquete instalable (wheel y sdist) a cada release publicado (FR-046).
# Con eso sinsim se instala con: uv tool install <url del wheel del release>
name: Paquete del release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  paquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: La versión del paquete coincide con la etiqueta
        run: |
          version="v$(grep -m1 '^version' backend/pyproject.toml | cut -d'"' -f2)"
          if [ "$version" != "${{ github.event.release.tag_name }}" ]; then
            echo "backend/pyproject.toml dice $version y la etiqueta es ${{ github.event.release.tag_name }}"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@v5

      - name: Construir la interfaz y el paquete
        run: make package

      - name: Comprobar que el wheel trae interfaz y snapshot de demostración
        run: |
          wheel=$(ls backend/dist/*.whl)
          unzip -l "$wheel" | grep -q "sinsim/web/index.html"
          unzip -l "$wheel" | grep -q "sinsim/_bundled/paratec/.*/manifest.json"

      - name: Adjuntar al release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" backend/dist/*.whl backend/dist/*.tar.gz --clobber
